# GitHub Actions CI/CD Pipeline
# Automated testing, building, and deployment

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_eval:
        description: 'Also run the paid LLM eval suite (RAG faithfulness + prompt-injection) — costs real money, run after prompt changes'
        type: boolean
        default: false

env:
  DOCKER_IMAGE: thai-regulatory-ai
  REGISTRY: ghcr.io

jobs:
  # Job 1: Linting and Code Quality
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 black isort mypy

      - name: Run Black
        run: black --check code/

      - name: Run isort
        run: isort --check-only code/

      - name: Run flake8
        run: flake8 code/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Run mypy (optional)
        run: mypy code/ --ignore-missing-imports
        continue-on-error: true

  # Job 2: Unit Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      # conf.py hard-fails at import time (RuntimeError) if this is unset — it's
      # required just to import the app modules, not to actually call the API.
      # The pytest suite under tests/ is pure unit/logic tests (regex, slot-fill,
      # entity detection) with zero live LLM calls, so a placeholder is correct
      # here — never put a real key in this file. Real-money integration tests
      # (see tests/test_rag_faithfulness.py) are excluded below via -m and are
      # not meant to run in this job.
      OPENROUTER_API_KEY: ci-placeholder-key-not-real
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run pytest
        run: |
          pytest tests/ \
            -m "not integration" \
            --cov=code \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # Job 3: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: bandit -r code/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # Job 4: Build Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

  # Deployment is manual, not CI/CD-driven: build image on the dev machine, push
  # to Docker Hub, SSH into the EC2 host, pull, and restart the container (see
  # project deployment notes for the exact command sequence). The deploy-staging
  # /deploy-production/load-test jobs that used to live here were never wired
  # up — every step was a bare `echo "Deploying..."` placeholder pointing at
  # unconfigured example.com URLs, and the load-test job referenced a
  # locustfile.py that doesn't exist in this repo, so it would fail immediately
  # if it ever ran. Removed rather than left as misleading dead scaffolding
  # that looks automated but silently does nothing. If real CI-driven
  # deployment is wanted later, it needs actual target infra (SSH key /
  # kubeconfig / cloud credentials as GitHub secrets) wired into real commands
  # here, not placeholder echo statements.

  # Job: Paid LLM Eval Suite (on-demand only)
  # RAG faithfulness (tests/test_rag_faithfulness.py) + prompt-injection
  # resistance (tests/test_prompt_injection.py) — both marked
  # @pytest.mark.integration and excluded from the `test` job above (which
  # runs `-m "not integration"`) precisely because they fire real, paid LLM
  # calls. Never runs on push/PR; only when someone manually triggers this
  # workflow with run_eval=true (e.g. right after changing a prompt file) —
  # matches the "run deliberately after prompt changes" convention already
  # established by code/scripts/answer_type_pilot.py's own docstring.
  #
  # Requires a REAL OPENROUTER_API_KEY repo secret (Settings → Secrets and
  # variables → Actions) — unlike the `test` job's placeholder key, this one
  # actually calls the API and needs to work. Not configured by this file;
  # someone with repo admin access has to add it once.
  eval:
    name: LLM Eval Suite (RAG faithfulness + prompt injection)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval == true
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Fail fast if OPENROUTER_API_KEY secret is missing
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY repo secret is not set — add a real key under Settings > Secrets and variables > Actions before running this job."
            exit 1
          fi

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx deepeval

      - name: Run paid eval suite
        run: pytest tests/test_rag_faithfulness.py tests/test_prompt_injection.py -m integration -v
