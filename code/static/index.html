<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RESTBIZ</title>
  <link rel="icon" href="https://supercoconut.co/wp-content/uploads/2025/04/cropped-Untitled-design-18.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <button id="newChatBtn" class="new-chat-btn">+ New chat</button>
        <div class="retention-box">Session จะเก็บไว้ 7 วัน แล้วลบอัตโนมัติ</div>
      </div>
      <div class="session-header">Recent chats</div>
      <div id="sessionList" class="session-list"></div>
      <div class="sidebar-bottom">
        <button id="deleteSessionBtn" class="side-btn danger">Delete current chat</button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuBtn" class="menu-btn" aria-label="เมนู">☰</button>
          <img class="brand-icon"
            src="https://supercoconut.co/wp-content/uploads/2025/04/cropped-Untitled-design-18.png"
            alt="logo" />
          <div>
            <div class="brand-title">RESTBIZ</div>
            <div class="brand-subtitle">ผู้ช่วยด้านกฎหมาย สำหรับธุรกิจร้านอาหาร</div>
          </div>
        </div>
      </header>

      <section id="welcomePanel" class="welcome-panel">
        <h1 id="welcomeTitle">กรุณารอสักครู่.....</h1>
        <p id="welcomeSubtitle">ระบบกำลังเตรียมพร้อม</p>
        <div id="topicCards" class="topic-cards"></div>
      </section>

      <section id="chatMessages" class="chat-messages"></section>

      <footer class="composer-wrap">
        <div class="composer">
          <textarea id="messageInput" placeholder="Message RESTBIZ..." rows="1"></textarea>
          <button id="sendBtn" class="send-btn" aria-label="Send">↑</button>
        </div>
      </footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
