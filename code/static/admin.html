<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RESTBIZ Admin</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --panel-2: #222636;
      --border: #2e3248;
      --text: #e2e8f0;
      --muted: #7b8db0;
      --accent: #f5c400;
      --blue: #5fb3d9;
      --green: #4ade80;
      --red: #f87171;
      --orange: #fb923c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 { font-size: 16px; font-weight: 700; color: var(--accent); }
    header span { color: var(--muted); font-size: 12px; }

    .refresh-btn {
      margin-left: auto;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 53px);
    }

    /* ── Stats bar ── */
    .stats-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      gap: 32px;
    }

    .stat-item { display: flex; flex-direction: column; gap: 2px; }
    .stat-label { font-size: 11px; color: var(--muted); }
    .stat-value { font-size: 18px; font-weight: 700; color: var(--accent); }

    /* ── Session list ── */
    .session-panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-title {
      padding: 12px 16px;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
    }

    .session-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }

    .session-item:hover { background: var(--panel-2); }
    .session-item.active { background: var(--panel-2); border-left: 2px solid var(--accent); }

    .s-id { font-size: 11px; color: var(--accent); margin-bottom: 4px; }
    .s-preview { color: var(--text); margin-bottom: 4px; line-height: 1.4; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-meta { font-size: 11px; color: var(--muted); display: flex; gap: 10px; }
    .badge { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 10px; }
    .badge.practical { color: var(--blue); border-color: var(--blue); }
    .badge.academic { color: var(--orange); border-color: var(--orange); }

    /* ── Detail panel ── */
    .detail-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .tab-btn {
      padding: 10px 18px;
      font-size: 12px;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }

    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: none;
    }

    .tab-content.active { display: block; }

    /* ── Messages ── */
    .msg-row { margin-bottom: 14px; }
    .msg-role {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .msg-role.user { color: var(--blue); }
    .msg-role.assistant { color: var(--green); }

    .msg-bubble {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 12px;
      font-family: Arial, sans-serif;
    }

    /* ── Slots / context ── */
    .kv-table { width: 100%; border-collapse: collapse; }
    .kv-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
    .kv-table td:first-child { color: var(--muted); width: 160px; }
    .kv-table td:last-child { color: var(--text); word-break: break-all; }

    /* ── Logs ── */
    .log-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      align-items: center;
    }

    .log-controls input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .log-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      overflow-y: auto;
      max-height: calc(100vh - 220px);
      font-size: 11px;
      line-height: 1.7;
    }

    .log-line { white-space: pre-wrap; word-break: break-all; }
    .log-line.info    { color: var(--text); }
    .log-line.error   { color: var(--red); }
    .log-line.warning { color: var(--orange); }
    .log-line.cache   { color: var(--green); }
    .log-line.retrieve { color: var(--blue); }
    .log-line.dim     { color: var(--muted); }

    /* ── Empty state ── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      gap: 8px;
    }

    .empty-icon { font-size: 32px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

    /* ── Nav toggle ── */
    .nav-toggle { display: flex; gap: 6px; }
    .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .nav-btn.active { color: var(--accent); border-color: var(--accent); }
    .nav-btn .count-pill {
      display: inline-block;
      background: var(--red);
      color: #1a0000;
      font-weight: 700;
      border-radius: 999px;
      padding: 0 6px;
      margin-left: 6px;
      font-size: 10px;
    }

    /* ── PDF queue list ── */
    .pq-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .pq-item:hover { background: var(--panel-2); }
    .pq-item.active { background: var(--panel-2); border-left: 2px solid var(--accent); }
    .pq-filename { color: var(--text); font-size: 12px; margin-bottom: 4px; word-break: break-all; }
    .pq-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .status-pill { border-radius: 4px; padding: 1px 7px; font-size: 10px; font-weight: 700; border: 1px solid; }
    .status-pill.pending  { color: var(--orange); border-color: var(--orange); }
    .status-pill.approved { color: var(--green);  border-color: var(--green); }
    .status-pill.rejected { color: var(--red);    border-color: var(--red); }

    .flag-pill { border-radius: 4px; padding: 1px 7px; font-size: 10px; font-weight: 700; }
    .flag-pill.high   { background: var(--red);    color: #1a0000; }
    .flag-pill.medium { background: var(--orange); color: #1a0f00; }
    .flag-pill.none   { background: var(--green);  color: #04170a; }

    /* ── PDF detail ── */
    .pq-header { padding: 16px; border-bottom: 1px solid var(--border); }
    .pq-header h2 { font-size: 14px; color: var(--text); margin-bottom: 6px; word-break: break-all; }
    .pq-header-meta { color: var(--muted); font-size: 11px; display: flex; gap: 14px; flex-wrap: wrap; }

    .page-card { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
    .page-card-header {
      background: var(--panel);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .page-card-header .p-title { font-weight: 700; color: var(--text); font-size: 12px; }
    .page-card-body { padding: 12px; display: none; }
    .page-card-body.open { display: block; }

    .flag-row {
      border: 1px solid var(--border);
      border-left: 3px solid var(--muted);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 11.5px;
    }
    .flag-row.high { border-left-color: var(--red); }
    .flag-row.medium { border-left-color: var(--orange); }
    .flag-row .flag-cat { color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; margin-bottom: 3px; }
    .flag-row .flag-msg { color: var(--text); font-family: Arial, sans-serif; line-height: 1.5; }
    .flag-row .flag-details { color: var(--muted); margin-top: 4px; word-break: break-all; }

    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .compare-col { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px; }
    .compare-col-title { color: var(--accent); font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    .compare-col pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Arial, sans-serif;
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--text);
      max-height: 320px;
      overflow-y: auto;
    }

    /* ── Decision form ── */
    .decision-box { padding: 16px; border-top: 1px solid var(--border); background: var(--panel); }
    .decision-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .decision-types { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .dtype-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .dtype-btn.selected { border-color: var(--blue); color: var(--blue); }
    .dtype-btn.new_category.selected { border-color: var(--orange); color: var(--orange); }

    .decision-notes {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: inherit;
      resize: vertical;
      min-height: 50px;
      margin-bottom: 12px;
    }

    .decision-actions { display: flex; gap: 10px; }
    .btn-approve, .btn-reject {
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      border: 1px solid;
    }
    .btn-approve { background: rgba(74,222,128,0.12); border-color: var(--green); color: var(--green); }
    .btn-reject  { background: rgba(248,113,113,0.12); border-color: var(--red); color: var(--red); }
    .btn-approve:disabled, .btn-reject:disabled { opacity: 0.4; cursor: not-allowed; }

    .already-decided {
      padding: 12px 16px;
      background: rgba(74,222,128,0.08);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Drafted fields editor ── */
    .fields-box { padding: 16px; border-top: 2px solid var(--accent); background: var(--panel); }
    .fields-title { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; font-weight: 700; }
    .fields-subtitle { font-size: 11px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
    .field-row { margin-bottom: 10px; }
    .field-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .field-input {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-family: Arial, sans-serif;
      resize: vertical;
      min-height: 34px;
    }
    .field-input:focus { border-color: var(--blue); outline: none; }
    .field-readonly { color: var(--muted); font-size: 11px; font-style: italic; padding: 4px 0; }
  </style>
</head>
<body>

<header>
  <h1>RESTBIZ Admin</h1>
  <div class="nav-toggle">
    <button class="nav-btn active" id="navBtnSessions" onclick="switchView('sessions')">💬 Sessions</button>
    <button class="nav-btn" id="navBtnPdfQueue" onclick="switchView('pdfqueue')">📄 PDF Review Queue<span class="count-pill" id="pdfQueueBadge" style="display:none">0</span></button>
  </div>
  <span id="lastRefresh">—</span>
  <button class="refresh-btn" onclick="loadAll()">⟳ Refresh</button>
</header>

<div class="stats-bar" id="statsBar">
  <div class="stat-item"><div class="stat-label">Sessions ทั้งหมด</div><div class="stat-value" id="statTotal">—</div></div>
  <div class="stat-item"><div class="stat-label">วันนี้</div><div class="stat-value" id="statToday">—</div></div>
  <div class="stat-item"><div class="stat-label">สัปดาห์นี้</div><div class="stat-value" id="statWeek">—</div></div>
  <div class="stat-item"><div class="stat-label">Tokens รวมทุก session</div><div class="stat-value" id="statTokens">—</div></div>
  <div class="stat-item"><div class="stat-label">ค่าใช้จ่ายรวม (USD)</div><div class="stat-value" id="statCost">—</div></div>
  <div class="stat-item"><div class="stat-label">Cache hit rate</div><div class="stat-value" id="statCache">—</div></div>
</div>

<div class="layout" id="view-sessions">
  <!-- Session list -->
  <div class="session-panel">
    <div class="panel-title">Sessions (<span id="sessionCount">0</span>)</div>
    <div class="session-list" id="sessionList"></div>
  </div>

  <!-- Detail -->
  <div class="detail-panel">
    <div class="detail-tabs">
      <button class="tab-btn active" onclick="switchTab('messages')">Messages</button>
      <button class="tab-btn" onclick="switchTab('context')">Context / Slots</button>
      <button class="tab-btn" onclick="switchTab('logs')">Server Logs</button>
    </div>

    <div class="tab-content active" id="tab-messages">
      <div class="empty" id="msgEmpty">
        <div class="empty-icon">💬</div>
        <div>เลือก session ด้านซ้ายเพื่อดู messages</div>
      </div>
      <div id="msgList" style="display:none"></div>
    </div>

    <div class="tab-content" id="tab-context">
      <div class="empty" id="ctxEmpty">
        <div class="empty-icon">🗂</div>
        <div>เลือก session เพื่อดู context และ collected slots</div>
      </div>
      <div id="ctxContent" style="display:none"></div>
    </div>

    <div class="tab-content" id="tab-logs">
      <div class="log-controls">
        <input type="text" id="logFilter" placeholder="Filter logs... (เช่น ERROR, retrieve, cache)" oninput="renderLogs()" />
        <button class="refresh-btn" onclick="loadLogs()">Reload</button>
      </div>
      <div class="log-box" id="logBox"><div style="color:var(--muted)">กำลังโหลด log...</div></div>
    </div>
  </div>
</div>

<!-- PDF Review Queue -->
<div class="layout" id="view-pdfqueue" style="display:none">
  <div class="session-panel">
    <div class="panel-title">รอตรวจสอบ (<span id="pdfQueueCount">0</span>)</div>
    <div class="session-list" id="pdfQueueList"></div>
  </div>

  <div class="detail-panel" id="pdfQueueDetailPanel">
    <div class="empty" id="pdfQueueEmpty">
      <div class="empty-icon">📄</div>
      <div>เลือกไฟล์ด้านซ้ายเพื่อตรวจสอบ</div>
    </div>
  </div>
</div>

<script>
  let allSessions = [];
  let allLogLines = [];
  let activeSession = null;

  function fmt(ts) {
    if (!ts) return "—";
    return new Date(ts * 1000).toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short" });
  }

  function escHtml(t) {
    return String(t || "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
  }

  async function apiGet(url) {
    const r = await fetch(url);
    return r.json();
  }

  // ── Stats ──────────────────────────────────────────────────────
  async function loadStats() {
    const d = await apiGet("/admin/api/stats");
    document.getElementById("statTotal").textContent = d.sessions?.total ?? "—";
    document.getElementById("statToday").textContent = d.sessions?.today ?? "—";
    document.getElementById("statWeek").textContent  = d.sessions?.this_week ?? "—";
    const hr = d.cache?.hit_rate;
    document.getElementById("statCache").textContent = hr != null ? (hr * 100).toFixed(0) + "%" : "—";
  }

  function updateTokenStats(sessions) {
    const totalTokens = sessions.reduce((s, x) => s + (x.total_tokens || 0), 0);
    const totalCost   = sessions.reduce((s, x) => s + (x.cost_usd || 0), 0);
    document.getElementById("statTokens").textContent =
      totalTokens > 0 ? totalTokens.toLocaleString() : "0";
    document.getElementById("statCost").textContent =
      totalCost > 0 ? "$" + totalCost.toFixed(4) : "$0.0000";
  }

  // ── Sessions ──────────────────────────────────────────────────
  async function loadSessions() {
    const d = await apiGet("/admin/api/sessions?limit=100");
    allSessions = d.sessions || [];
    document.getElementById("sessionCount").textContent = allSessions.length;
    updateTokenStats(allSessions);
    renderSessionList();
  }

  function renderSessionList() {
    const el = document.getElementById("sessionList");
    if (!allSessions.length) {
      el.innerHTML = '<div style="padding:20px;color:var(--muted);text-align:center">ยังไม่มี session</div>';
      return;
    }
    el.innerHTML = allSessions.map(s => `
      <div class="session-item ${s.session_id === activeSession ? 'active' : ''}"
           onclick="selectSession('${s.session_id}')">
        <div class="s-id">${escHtml(s.session_id)}</div>
        <div class="s-preview">${escHtml(s.preview || "—")}</div>
        <div class="s-meta">
          <span class="badge ${escHtml(s.persona_id)}">${escHtml(s.persona_id)}</span>
          <span>💬 ${s.user_messages}/${s.total_messages}</span>
          <span>🔢 ${(s.total_tokens || 0).toLocaleString()} tokens</span>
          <span>💵 $${(s.cost_usd || 0).toFixed(4)}</span>
          <span>${fmt(s.updated_at)}</span>
        </div>
      </div>
    `).join("");
  }

  // ── Session detail ─────────────────────────────────────────────
  async function selectSession(sid) {
    activeSession = sid;
    renderSessionList();

    const d = await apiGet(`/admin/api/session/${sid}`);

    // Messages tab
    const msgs = d.messages || [];
    if (!msgs.length) {
      document.getElementById("msgEmpty").style.display = "";
      document.getElementById("msgList").style.display = "none";
    } else {
      document.getElementById("msgEmpty").style.display = "none";
      document.getElementById("msgList").style.display = "";
      document.getElementById("msgList").innerHTML = msgs.map(m => `
        <div class="msg-row">
          <div class="msg-role ${m.role}">${m.role === "user" ? "👤 User" : "🤖 RESTBIZ"}</div>
          <div class="msg-bubble">${escHtml(m.content || "")}</div>
        </div>
      `).join("");
    }

    // Context tab
    const slots = d.collected_slots || {};
    const rows = [
      ["session_id",         d.session_id],
      ["persona",            d.persona_id],
      ["fsm_state",          d.fsm_state || "—"],
      ["last_topic",         d.last_topic || "—"],
      ["total_messages",     d.total_messages],
      ["prompt_tokens",      (d.prompt_tokens || 0).toLocaleString()],
      ["completion_tokens",  (d.completion_tokens || 0).toLocaleString()],
      ["total_tokens",       (d.total_tokens || 0).toLocaleString()],
      ["cost_usd",           "$" + (d.cost_usd || 0).toFixed(6)],
      ...Object.entries(slots).map(([k, v]) => [`slot: ${k}`, v]),
    ];

    if (rows.length) {
      document.getElementById("ctxEmpty").style.display = "none";
      document.getElementById("ctxContent").style.display = "";
      document.getElementById("ctxContent").innerHTML = `
        <table class="kv-table">
          ${rows.map(([k, v]) => `<tr><td>${escHtml(k)}</td><td>${escHtml(String(v))}</td></tr>`).join("")}
        </table>`;
    }
  }

  // ── Logs ──────────────────────────────────────────────────────
  async function loadLogs() {
    const d = await apiGet("/admin/api/logs?lines=200");
    allLogLines = d.lines || [];
    renderLogs();
  }

  function renderLogs() {
    const filter = (document.getElementById("logFilter").value || "").toLowerCase();
    const lines = filter
      ? allLogLines.filter(l => l.toLowerCase().includes(filter))
      : allLogLines;

    document.getElementById("logBox").innerHTML = lines.map(l => {
      let cls = "dim";
      const ll = l.toLowerCase();
      if (ll.includes("error"))    cls = "error";
      else if (ll.includes("warning") || ll.includes("warn")) cls = "warning";
      else if (ll.includes("cache hit") || ll.includes("🎯")) cls = "cache";
      else if (ll.includes("retrieve") || ll.includes("📚") || ll.includes("doc[")) cls = "retrieve";
      else if (ll.includes("info") || ll.includes("←") || ll.includes("→")) cls = "info";
      return `<div class="log-line ${cls}">${escHtml(l)}</div>`;
    }).join("") || '<div style="color:var(--muted)">ไม่มีผลลัพธ์ที่ตรงกับ filter</div>';

    // Scroll to bottom
    const box = document.getElementById("logBox");
    box.scrollTop = box.scrollHeight;
  }

  // ── Tabs ──────────────────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll(".tab-btn").forEach((b, i) => {
      const tabs = ["messages", "context", "logs"];
      b.classList.toggle("active", tabs[i] === name);
    });
    document.querySelectorAll(".tab-content").forEach(el => {
      el.classList.toggle("active", el.id === `tab-${name}`);
    });
    if (name === "logs" && !allLogLines.length) loadLogs();
  }

  // ── View switch (Sessions ⇄ PDF Review Queue) ────────────────────
  function switchView(name) {
    document.getElementById("navBtnSessions").classList.toggle("active", name === "sessions");
    document.getElementById("navBtnPdfQueue").classList.toggle("active", name === "pdfqueue");
    document.getElementById("view-sessions").style.display = name === "sessions" ? "" : "none";
    document.getElementById("view-pdfqueue").style.display = name === "pdfqueue" ? "" : "none";
    document.getElementById("statsBar").style.display = name === "sessions" ? "" : "none";
    if (name === "pdfqueue") loadPdfQueue();
  }

  // ── PDF Review Queue ──────────────────────────────────────────
  let allPdfQueueItems = [];
  let activePdfQueueItem = null;
  let selectedDecisionType = null;

  async function loadPdfQueue() {
    const d = await apiGet("/admin/api/pdf-queue");
    allPdfQueueItems = d.items || [];
    document.getElementById("pdfQueueCount").textContent = allPdfQueueItems.length;

    const pendingCount = allPdfQueueItems.filter(i => i.review_status === "pending").length;
    const badge = document.getElementById("pdfQueueBadge");
    if (pendingCount > 0) {
      badge.style.display = "";
      badge.textContent = pendingCount;
    } else {
      badge.style.display = "none";
    }
    renderPdfQueueList();
  }

  function flagCountPill(totalFlags, highFlags) {
    if (highFlags > 0) return `<span class="flag-pill high">${totalFlags} flag${totalFlags > 1 ? "s" : ""}</span>`;
    if (totalFlags > 0) return `<span class="flag-pill medium">${totalFlags} flag${totalFlags > 1 ? "s" : ""}</span>`;
    return `<span class="flag-pill none">✓ ไม่มี flag</span>`;
  }

  function renderPdfQueueList() {
    const el = document.getElementById("pdfQueueList");
    if (!allPdfQueueItems.length) {
      el.innerHTML = '<div style="padding:20px;color:var(--muted);text-align:center">ยังไม่มีไฟล์ในคิว</div>';
      return;
    }
    el.innerHTML = allPdfQueueItems.map(i => `
      <div class="pq-item ${i.id === activePdfQueueItem ? 'active' : ''}" onclick="selectPdfQueueItem('${i.id}')">
        <div class="pq-filename">${escHtml(i.filename)}</div>
        <div class="pq-meta">
          <span class="status-pill ${escHtml(i.review_status)}">${escHtml(i.review_status)}</span>
          ${flagCountPill(i.total_flag_count, i.high_severity_flag_count)}
          <span style="color:var(--muted);font-size:11px">${fmt(i.uploaded_at)}</span>
        </div>
      </div>
    `).join("");
  }

  async function selectPdfQueueItem(id) {
    activePdfQueueItem = id;
    selectedDecisionType = null;
    renderPdfQueueList();

    const item = await apiGet(`/admin/api/pdf-queue/${id}`);
    renderPdfQueueDetail(item);
  }

  function flagRow(f) {
    const detailsStr = Object.entries(f.details || {})
      .map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`)
      .join("  |  ");
    return `
      <div class="flag-row ${escHtml(f.severity)}">
        <div class="flag-cat">${escHtml(f.category)} · ${escHtml(f.severity)}</div>
        <div class="flag-msg">${escHtml(f.message)}</div>
        ${detailsStr ? `<div class="flag-details">${escHtml(detailsStr)}</div>` : ""}
      </div>`;
  }

  function pageCard(p, idx) {
    const flags = p.flags || [];
    const hasHigh = flags.some(f => f.severity === "high");
    const badge = flags.length
      ? `<span class="flag-pill ${hasHigh ? 'high' : 'medium'}">${flags.length} flag${flags.length > 1 ? "s" : ""}</span>`
      : `<span class="flag-pill none">✓ ok</span>`;
    return `
      <div class="page-card">
        <div class="page-card-header" onclick="togglePageCard(${idx})">
          <span class="p-title">หน้า ${p.page_num}</span>
          ${badge}
          <span style="margin-left:auto;color:var(--muted)" id="page-toggle-${idx}">${idx === 0 ? "▾" : "▸"}</span>
        </div>
        <div class="page-card-body ${idx === 0 ? 'open' : ''}" id="page-body-${idx}">
          ${flags.map(flagRow).join("") || '<div style="color:var(--muted);font-size:11.5px;margin-bottom:8px">ไม่มี flag ในหน้านี้</div>'}
          <div class="compare-grid">
            <div class="compare-col">
              <div class="compare-col-title">🌪 Typhoon OCR</div>
              <pre>${escHtml(p.typhoon_markdown)}</pre>
            </div>
            <div class="compare-col">
              <div class="compare-col-title">🤖 Claude Vision</div>
              <pre>${escHtml(p.claude_markdown)}</pre>
            </div>
          </div>
        </div>
      </div>`;
  }

  function togglePageCard(idx) {
    const body = document.getElementById(`page-body-${idx}`);
    const toggle = document.getElementById(`page-toggle-${idx}`);
    const isOpen = body.classList.toggle("open");
    toggle.textContent = isOpen ? "▾" : "▸";
  }

  function selectDecisionType(t) {
    selectedDecisionType = t;
    document.querySelectorAll(".dtype-btn").forEach(b => {
      b.classList.toggle("selected", b.dataset.type === t);
    });
    const approveBtn = document.getElementById("btnApproveDecision");
    if (approveBtn) approveBtn.disabled = false;
  }

  function fieldsEditorHtml(item) {
    const fields = item.llm_drafted_fields || {};
    const keys = Object.keys(fields);
    const rows = keys.length
      ? keys.map(k => `
          <div class="field-row">
            <div class="field-label">${escHtml(k)}</div>
            <textarea class="field-input" data-field-key="${escHtml(k)}">${escHtml(fields[k] || "")}</textarea>
          </div>`).join("")
      : '<div class="field-readonly">ไม่มีข้อมูลที่ร่างไว้ (item นี้อาจถูกสร้างโดยไม่ผ่าน field-drafting)</div>';

    return `
      <div class="fields-box">
        <div class="fields-title">📝 ฟิลด์ที่ร่างไว้สำหรับเขียนเข้า Sheet</div>
        <div class="fields-subtitle">
          ตรวจสอบ/แก้ไขก่อนอนุมัติ — ค่าที่แก้ในนี้จะถูกใช้เขียนจริง ไม่ใช่ค่าที่ LLM ร่างไว้เฉยๆ<br>
          "อ้างอิง (Research)" จะใส่ชื่อไฟล์ต้นฉบับให้อัตโนมัติ · "เอกสาร AI ร้านอาหาร"/"รวมลิงค์" เว้นว่างไว้ให้กรอกเองถ้าจำเป็น (เป็นลิงก์ภายในทีม ไม่ได้มาจากเอกสาร)
        </div>
        ${rows}
      </div>`;
  }

  function collectEditedFields() {
    const edited = {};
    document.querySelectorAll(".field-input").forEach(el => {
      edited[el.dataset.fieldKey] = el.value;
    });
    return edited;
  }

  function renderPdfQueueDetail(item) {
    const panel = document.getElementById("pdfQueueDetailPanel");
    const totalFlags = item.pages.reduce((s, p) => s + (p.flags || []).length, 0);
    const highFlags = item.pages.reduce((s, p) => s + (p.flags || []).filter(f => f.severity === "high").length, 0);

    let decisionHtml;
    if (item.review_status !== "pending") {
      decisionHtml = `
        <div class="already-decided">
          ✓ ตรวจสอบแล้ว: <b>${escHtml(item.review_status)}</b>
          ${item.decision_type ? ` — ประเภท: <b>${escHtml(item.decision_type)}</b>` : ""}
          ${item.reviewer_notes ? `<br>หมายเหตุ: ${escHtml(item.reviewer_notes)}` : ""}
        </div>`;
    } else {
      decisionHtml = `
        <div class="decision-box">
          <div class="decision-title">การตัดสินใจ</div>
          <div class="decision-types">
            <button class="dtype-btn" data-type="new" onclick="selectDecisionType('new')">① ข้อมูลใหม่</button>
            <button class="dtype-btn" data-type="duplicate" onclick="selectDecisionType('duplicate')">② ซ้ำกับที่มีอยู่แล้ว</button>
            <button class="dtype-btn" data-type="update" onclick="selectDecisionType('update')">③ อัปเดตแทนที่ของเก่า</button>
            <button class="dtype-btn new_category" data-type="new_category" onclick="selectDecisionType('new_category')">④ กฎหมายหมวดใหม่</button>
          </div>
          <textarea class="decision-notes" id="decisionNotes" placeholder="หมายเหตุ (ถ้ามี)"></textarea>
          <div class="decision-actions">
            <button class="btn-approve" id="btnApproveDecision" disabled onclick="submitDecision('${item.id}','approved')">✓ อนุมัติ (เขียนเพิ่มเข้า Sheet เท่านั้น ไม่ลบ/ทับของเดิม)</button>
            <button class="btn-reject" onclick="submitDecision('${item.id}','rejected')">✕ ปฏิเสธ</button>
          </div>
        </div>`;
    }

    panel.innerHTML = `
      <div class="pq-header">
        <h2>${escHtml(item.filename)}</h2>
        <div class="pq-header-meta">
          <span>📅 อัปโหลด: ${fmt(item.uploaded_at)}</span>
          <span>📄 ${item.pages.length} หน้า</span>
          <span>🚩 ${totalFlags} flags (${highFlags} severity สูง)</span>
        </div>
      </div>
      <div style="flex:1;overflow-y:auto;padding:16px">
        ${item.pages.map((p, idx) => pageCard(p, idx)).join("")}
      </div>
      ${item.review_status === "pending" ? fieldsEditorHtml(item) : ""}
      ${decisionHtml}
    `;
  }

  async function submitDecision(itemId, reviewStatus) {
    if (reviewStatus === "approved" && !selectedDecisionType) {
      alert("กรุณาเลือกประเภทการตัดสินใจก่อนอนุมัติ");
      return;
    }
    const notesEl = document.getElementById("decisionNotes");
    const body = {
      review_status: reviewStatus,
      decision_type: reviewStatus === "approved" ? selectedDecisionType : null,
      reviewer_notes: notesEl ? notesEl.value : "",
      edited_fields: reviewStatus === "approved" ? collectEditedFields() : null,
    };
    const r = await fetch(`/admin/api/pdf-queue/${itemId}/decision`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      alert("เกิดข้อผิดพลาด: " + (err.error || r.status));
      return;
    }
    await loadPdfQueue();
    selectPdfQueueItem(itemId);
  }

  // ── Init ──────────────────────────────────────────────────────
  async function loadAll() {
    document.getElementById("lastRefresh").textContent =
      "อัพเดท " + new Date().toLocaleTimeString("th-TH");
    await Promise.all([loadStats(), loadSessions(), loadPdfQueue()]);
  }

  loadAll();
  // Auto-refresh ทุก 30 วินาที
  setInterval(loadAll, 30000);
</script>
</body>
</html>
