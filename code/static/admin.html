<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RESTBIZ Admin</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --panel-2: #222636;
      --border: #2e3248;
      --text: #e2e8f0;
      --muted: #7b8db0;
      --accent: #f5c400;
      --blue: #5fb3d9;
      --green: #4ade80;
      --red: #f87171;
      --orange: #fb923c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 { font-size: 16px; font-weight: 700; color: var(--accent); }
    header span { color: var(--muted); font-size: 12px; }

    .refresh-btn {
      margin-left: auto;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 53px);
    }

    /* ── Stats bar ── */
    .stats-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      gap: 32px;
    }

    .stat-item { display: flex; flex-direction: column; gap: 2px; }
    .stat-label { font-size: 11px; color: var(--muted); }
    .stat-value { font-size: 18px; font-weight: 700; color: var(--accent); }

    /* ── Session list ── */
    .session-panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-title {
      padding: 12px 16px;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
    }

    .session-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }

    .session-item:hover { background: var(--panel-2); }
    .session-item.active { background: var(--panel-2); border-left: 2px solid var(--accent); }

    .s-id { font-size: 11px; color: var(--accent); margin-bottom: 4px; }
    .s-preview { color: var(--text); margin-bottom: 4px; line-height: 1.4; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-meta { font-size: 11px; color: var(--muted); display: flex; gap: 10px; }
    .badge { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 10px; }
    .badge.practical { color: var(--blue); border-color: var(--blue); }
    .badge.academic { color: var(--orange); border-color: var(--orange); }
    .new-category-badge { color: var(--red); border-color: var(--red); font-weight: 700; }

    /* ── Detail panel ── */
    .detail-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .tab-btn {
      padding: 10px 18px;
      font-size: 12px;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }

    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: none;
    }

    .tab-content.active { display: block; }

    /* ── Messages ── */
    .msg-row { margin-bottom: 14px; }
    .msg-role {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .msg-role.user { color: var(--blue); }
    .msg-role.assistant { color: var(--green); }

    .msg-bubble {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 12px;
      font-family: Arial, sans-serif;
    }

    /* ── Slots / context ── */
    .kv-table { width: 100%; border-collapse: collapse; }
    .kv-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
    .kv-table td:first-child { color: var(--muted); width: 160px; }
    .kv-table td:last-child { color: var(--text); word-break: break-all; }

    /* ── Logs ── */
    .log-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      align-items: center;
    }

    .log-controls input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .log-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      overflow-y: auto;
      max-height: calc(100vh - 220px);
      font-size: 11px;
      line-height: 1.7;
    }

    .log-line { white-space: pre-wrap; word-break: break-all; }
    .log-line.info    { color: var(--text); }
    .log-line.error   { color: var(--red); }
    .log-line.warning { color: var(--orange); }
    .log-line.cache   { color: var(--green); }
    .log-line.retrieve { color: var(--blue); }
    .log-line.dim     { color: var(--muted); }

    /* ── Empty state ── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      gap: 8px;
    }

    .empty-icon { font-size: 32px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

    /* ── Nav toggle ── */
    .nav-toggle { display: flex; gap: 6px; }
    .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .nav-btn.active { color: var(--accent); border-color: var(--accent); }
    .nav-btn .count-pill {
      display: inline-block;
      background: var(--red);
      color: #1a0000;
      font-weight: 700;
      border-radius: 999px;
      padding: 0 6px;
      margin-left: 6px;
      font-size: 10px;
    }

    /* ── PDF queue list ── */
    .pq-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .pq-item:hover { background: var(--panel-2); }
    .pq-item.active { background: var(--panel-2); border-left: 2px solid var(--accent); }
    .pq-filename { color: var(--text); font-size: 12px; margin-bottom: 4px; word-break: break-all; }
    .pq-page-range { color: var(--muted); font-weight: 400; }
    .pq-subtitle { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
    .pq-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .status-pill { border-radius: 4px; padding: 1px 7px; font-size: 10px; font-weight: 700; border: 1px solid; }
    .status-pill.pending  { color: var(--orange); border-color: var(--orange); }
    .status-pill.approved { color: var(--green);  border-color: var(--green); }
    .status-pill.rejected { color: var(--red);    border-color: var(--red); }
    .status-pill.processing { color: var(--blue); border-color: var(--blue); }
    .status-pill.failed-retry { color: var(--red); border-color: var(--red); }

    /* ── In-flight (S3 status/, no ReviewItem yet — see pdf_status_tracker.py) ── */
    .pq-item.in-flight { cursor: default; }
    .pq-item.in-flight:hover { background: transparent; }
    .in-flight-error { color: var(--red); font-size: 11px; margin-top: 4px; word-break: break-all; }

    .flag-pill { border-radius: 4px; padding: 1px 7px; font-size: 10px; font-weight: 700; }
    .flag-pill.high   { background: var(--red);    color: #1a0000; }
    .flag-pill.medium { background: var(--orange); color: #1a0f00; }
    .flag-pill.none   { background: var(--green);  color: #04170a; }

    /* ── PDF detail ── */
    .pq-header { padding: 16px; border-bottom: 1px solid var(--border); }
    .pq-header h2 { font-size: 14px; color: var(--text); margin-bottom: 6px; word-break: break-all; }
    .pq-header-meta { color: var(--muted); font-size: 11px; display: flex; gap: 14px; flex-wrap: wrap; }

    /* ── Candidate matches (duplicate-detection hint) ── */
    .candidate-matches { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
    .cm-title { padding: 10px 12px; background: var(--panel); font-size: 12px; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--border); }
    .cm-empty { padding: 10px 12px; color: var(--muted); font-size: 12px; }
    .cm-row-wrap:last-child .cm-row { border-bottom: none; }
    .cm-row { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; font-size: 12px; cursor: pointer; }
    .cm-row:hover { background: var(--panel); }
    .cm-score { font-weight: 700; min-width: 42px; }
    .cm-score.high { color: var(--red); }
    .cm-score.medium { color: var(--orange); }
    .cm-score.low { color: var(--muted); }
    .cm-info { color: var(--text); flex: 1; }
    .cm-info .cm-row-num { color: var(--accent); }
    .cm-badges { display: flex; gap: 4px; flex-wrap: wrap; }
    .cm-badge { background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); padding: 2px 7px; border-radius: 10px; font-size: 10px; white-space: nowrap; }
    .cm-use-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 3px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; white-space: nowrap; }
    .cm-use-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cm-detail { display: none; padding: 0 12px 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg); }
    .cm-detail.open { display: block; }
    .cm-llm-reasoning { font-size: 11.5px; color: var(--muted); padding: 8px 0 4px 0; }
    .cm-diff-none { font-size: 11.5px; color: var(--muted); padding: 8px 0; }
    .cm-diff-table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 6px; }
    .cm-diff-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--border); }
    .cm-diff-table td { padding: 4px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .cm-diff-field { color: var(--muted); white-space: nowrap; }
    .cm-diff-old { color: var(--red); }
    .cm-diff-new { color: var(--green); }
    .cm-diff-blank { color: var(--muted); font-style: italic; }
    .category-fit-banner { border: 1px solid var(--orange); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 12px; color: var(--orange); }
    .category-fit-banner .cf-reasoning { color: var(--muted); }

    /* ── Relevance check (in-scope-for-restaurant-business hint) ── */
    .relevance-check { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; padding: 10px 12px; font-size: 12px; display: flex; gap: 8px; align-items: baseline; }
    .relevance-check.relevant { border-color: var(--green); }
    .relevance-check.uncertain { border-color: var(--orange); }
    .relevance-check.not_relevant { border-color: var(--red); background: rgba(248, 113, 113, 0.08); }
    .rc-tag { font-weight: 700; white-space: nowrap; }
    .relevance-check.relevant .rc-tag { color: var(--green); }
    .relevance-check.uncertain .rc-tag { color: var(--orange); }
    .relevance-check.not_relevant .rc-tag { color: var(--red); }
    .rc-reasoning { color: var(--muted); }

    /* ── Decision box: old-row-ref input (shown only for "update") ── */
    .old-row-ref-box { margin: 10px 0; }
    .old-row-ref-label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .old-row-ref-input { width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 12px; }

    /* ── Content-shape banner (structured vs know-how routing) ── */
    .content-shape { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; padding: 10px 12px; font-size: 12px; }
    .content-shape.know_how { border-color: var(--blue); }
    .cs-reasoning { color: var(--muted); }

    /* ── Know-how topics (read-only review cards) ── */
    .knowhow-topics { margin-bottom: 14px; }
    .kt-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .kt-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--panel); }
    .kt-card-title { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
    .kt-card-meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .kt-card-summary { font-size: 12px; color: var(--text); line-height: 1.6; margin-bottom: 8px; }
    .kt-fulltext-details summary { cursor: pointer; font-size: 11px; color: var(--blue); }
    .kt-fulltext { margin-top: 8px; padding: 10px; background: var(--panel-2); border-radius: 6px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    .decision-subtitle { font-size: 11px; color: var(--muted); margin-bottom: 10px; }

    .page-card { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
    .page-card-header {
      background: var(--panel);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .page-card-header .p-title { font-weight: 700; color: var(--text); font-size: 12px; }
    .page-card-body { padding: 12px; display: none; }
    .page-card-body.open { display: block; }

    .flag-row {
      border: 1px solid var(--border);
      border-left: 3px solid var(--muted);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 11.5px;
    }
    .flag-row.high { border-left-color: var(--red); }
    .flag-row.medium { border-left-color: var(--orange); }
    .flag-row .flag-cat { color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; margin-bottom: 3px; }
    .flag-row .flag-msg { color: var(--text); font-family: Arial, sans-serif; line-height: 1.5; }
    .flag-row .flag-details { color: var(--muted); margin-top: 4px; word-break: break-all; }

    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .compare-col { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px; }
    .compare-col-title { color: var(--accent); font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    .compare-col pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Arial, sans-serif;
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--text);
      max-height: 320px;
      overflow-y: auto;
    }

    /* ── Decision form ── */
    .decision-box { padding: 16px; border-top: 1px solid var(--border); background: var(--panel); }
    .decision-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .decision-types { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .dtype-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .dtype-btn.selected { border-color: var(--blue); color: var(--blue); }
    .dtype-btn.new_category.selected { border-color: var(--orange); color: var(--orange); }

    .decision-notes {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: inherit;
      resize: vertical;
      min-height: 50px;
      margin-bottom: 12px;
    }

    .decision-actions { display: flex; gap: 10px; }
    .btn-approve, .btn-reject {
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      border: 1px solid;
    }
    .btn-approve { background: rgba(74,222,128,0.12); border-color: var(--green); color: var(--green); }
    .btn-reject  { background: rgba(248,113,113,0.12); border-color: var(--red); color: var(--red); }
    .btn-approve:disabled, .btn-reject:disabled { opacity: 0.4; cursor: not-allowed; }

    .already-decided {
      padding: 12px 16px;
      background: rgba(74,222,128,0.08);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Drafted fields editor ── */
    .fields-box { padding: 16px; border-top: 2px solid var(--accent); background: var(--panel); }
    .fields-title { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; font-weight: 700; }
    .fields-subtitle { font-size: 11px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
    .field-row { margin-bottom: 10px; }
    .field-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .field-input {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-family: Arial, sans-serif;
      resize: vertical;
      min-height: 34px;
    }
    .field-input:focus { border-color: var(--blue); outline: none; }
    .field-readonly { color: var(--muted); font-size: 11px; font-style: italic; padding: 4px 0; }
  </style>
</head>
<body>

<header>
  <h1>RESTBIZ Admin</h1>
  <div class="nav-toggle">
    <button class="nav-btn active" id="navBtnSessions" onclick="switchView('sessions')">💬 Sessions</button>
    <button class="nav-btn" id="navBtnPdfQueue" onclick="switchView('pdfqueue')">📄 PDF Review Queue<span class="count-pill" id="pdfQueueBadge" style="display:none">0</span></button>
  </div>
  <span id="lastRefresh">—</span>
  <button class="refresh-btn" onclick="loadAll()">⟳ Refresh</button>
</header>

<div class="stats-bar" id="statsBar">
  <div class="stat-item"><div class="stat-label">Sessions ทั้งหมด</div><div class="stat-value" id="statTotal">—</div></div>
  <div class="stat-item"><div class="stat-label">วันนี้</div><div class="stat-value" id="statToday">—</div></div>
  <div class="stat-item"><div class="stat-label">สัปดาห์นี้</div><div class="stat-value" id="statWeek">—</div></div>
  <div class="stat-item"><div class="stat-label">Tokens รวมทุก session</div><div class="stat-value" id="statTokens">—</div></div>
  <div class="stat-item"><div class="stat-label">ค่าใช้จ่ายรวม (USD)</div><div class="stat-value" id="statCost">—</div></div>
  <div class="stat-item"><div class="stat-label">Cache hit rate</div><div class="stat-value" id="statCache">—</div></div>
</div>

<div class="layout" id="view-sessions">
  <!-- Session list -->
  <div class="session-panel">
    <div class="panel-title">Sessions (<span id="sessionCount">0</span>)</div>
    <div class="session-list" id="sessionList"></div>
  </div>

  <!-- Detail -->
  <div class="detail-panel">
    <div class="detail-tabs">
      <button class="tab-btn active" onclick="switchTab('messages')">Messages</button>
      <button class="tab-btn" onclick="switchTab('context')">Context / Slots</button>
      <button class="tab-btn" onclick="switchTab('logs')">Server Logs</button>
    </div>

    <div class="tab-content active" id="tab-messages">
      <div class="empty" id="msgEmpty">
        <div class="empty-icon">💬</div>
        <div>เลือก session ด้านซ้ายเพื่อดู messages</div>
      </div>
      <div id="msgList" style="display:none"></div>
    </div>

    <div class="tab-content" id="tab-context">
      <div class="empty" id="ctxEmpty">
        <div class="empty-icon">🗂</div>
        <div>เลือก session เพื่อดู context และ collected slots</div>
      </div>
      <div id="ctxContent" style="display:none"></div>
    </div>

    <div class="tab-content" id="tab-logs">
      <div class="log-controls">
        <input type="text" id="logFilter" placeholder="Filter logs... (เช่น ERROR, retrieve, cache)" oninput="renderLogs()" />
        <button class="refresh-btn" onclick="loadLogs()">Reload</button>
      </div>
      <div class="log-box" id="logBox"><div style="color:var(--muted)">กำลังโหลด log...</div></div>
    </div>
  </div>
</div>

<!-- PDF Review Queue -->
<div class="layout" id="view-pdfqueue" style="display:none">
  <div class="session-panel">
    <div class="panel-title">รอตรวจสอบ (<span id="pdfQueueCount">0</span>)</div>
    <div class="session-list" id="pdfQueueList"></div>
  </div>

  <div class="detail-panel" id="pdfQueueDetailPanel">
    <div class="empty" id="pdfQueueEmpty">
      <div class="empty-icon">📄</div>
      <div>เลือกไฟล์ด้านซ้ายเพื่อตรวจสอบ</div>
    </div>
  </div>
</div>

<script>
  let allSessions = [];
  let allLogLines = [];
  let activeSession = null;

  function fmt(ts) {
    if (!ts) return "—";
    return new Date(ts * 1000).toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short" });
  }

  function escHtml(t) {
    return String(t || "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
  }

  async function apiGet(url) {
    const r = await fetch(url);
    return r.json();
  }

  // ── Stats ──────────────────────────────────────────────────────
  async function loadStats() {
    const d = await apiGet("/admin/api/stats");
    document.getElementById("statTotal").textContent = d.sessions?.total ?? "—";
    document.getElementById("statToday").textContent = d.sessions?.today ?? "—";
    document.getElementById("statWeek").textContent  = d.sessions?.this_week ?? "—";
    const hr = d.cache?.hit_rate;
    document.getElementById("statCache").textContent = hr != null ? (hr * 100).toFixed(0) + "%" : "—";
  }

  function updateTokenStats(sessions) {
    const totalTokens = sessions.reduce((s, x) => s + (x.total_tokens || 0), 0);
    const totalCost   = sessions.reduce((s, x) => s + (x.cost_usd || 0), 0);
    document.getElementById("statTokens").textContent =
      totalTokens > 0 ? totalTokens.toLocaleString() : "0";
    document.getElementById("statCost").textContent =
      totalCost > 0 ? "$" + totalCost.toFixed(4) : "$0.0000";
  }

  // ── Sessions ──────────────────────────────────────────────────
  async function loadSessions() {
    const d = await apiGet("/admin/api/sessions?limit=100");
    allSessions = d.sessions || [];
    document.getElementById("sessionCount").textContent = allSessions.length;
    updateTokenStats(allSessions);
    renderSessionList();
  }

  function renderSessionList() {
    const el = document.getElementById("sessionList");
    if (!allSessions.length) {
      el.innerHTML = '<div style="padding:20px;color:var(--muted);text-align:center">ยังไม่มี session</div>';
      return;
    }
    el.innerHTML = allSessions.map(s => `
      <div class="session-item ${s.session_id === activeSession ? 'active' : ''}"
           onclick="selectSession('${s.session_id}')">
        <div class="s-id">${escHtml(s.session_id)}</div>
        <div class="s-preview">${escHtml(s.preview || "—")}</div>
        <div class="s-meta">
          <span class="badge ${escHtml(s.persona_id)}">${escHtml(s.persona_id)}</span>
          <span>💬 ${s.user_messages}/${s.total_messages}</span>
          <span>🔢 ${(s.total_tokens || 0).toLocaleString()} tokens</span>
          <span>💵 $${(s.cost_usd || 0).toFixed(4)}</span>
          <span>${fmt(s.updated_at)}</span>
        </div>
      </div>
    `).join("");
  }

  // ── Session detail ─────────────────────────────────────────────
  async function selectSession(sid) {
    activeSession = sid;
    renderSessionList();

    const d = await apiGet(`/admin/api/session/${sid}`);

    // Messages tab
    const msgs = d.messages || [];
    if (!msgs.length) {
      document.getElementById("msgEmpty").style.display = "";
      document.getElementById("msgList").style.display = "none";
    } else {
      document.getElementById("msgEmpty").style.display = "none";
      document.getElementById("msgList").style.display = "";
      document.getElementById("msgList").innerHTML = msgs.map(m => `
        <div class="msg-row">
          <div class="msg-role ${m.role}">${m.role === "user" ? "👤 User" : "🤖 RESTBIZ"}</div>
          <div class="msg-bubble">${escHtml(m.content || "")}</div>
        </div>
      `).join("");
    }

    // Context tab
    const slots = d.collected_slots || {};
    const rows = [
      ["session_id",         d.session_id],
      ["persona",            d.persona_id],
      ["fsm_state",          d.fsm_state || "—"],
      ["last_topic",         d.last_topic || "—"],
      ["total_messages",     d.total_messages],
      ["prompt_tokens",      (d.prompt_tokens || 0).toLocaleString()],
      ["completion_tokens",  (d.completion_tokens || 0).toLocaleString()],
      ["total_tokens",       (d.total_tokens || 0).toLocaleString()],
      ["cost_usd",           "$" + (d.cost_usd || 0).toFixed(6)],
      ...Object.entries(slots).map(([k, v]) => [`slot: ${k}`, v]),
    ];

    if (rows.length) {
      document.getElementById("ctxEmpty").style.display = "none";
      document.getElementById("ctxContent").style.display = "";
      document.getElementById("ctxContent").innerHTML = `
        <table class="kv-table">
          ${rows.map(([k, v]) => `<tr><td>${escHtml(k)}</td><td>${escHtml(String(v))}</td></tr>`).join("")}
        </table>`;
    }
  }

  // ── Logs ──────────────────────────────────────────────────────
  async function loadLogs() {
    const d = await apiGet("/admin/api/logs?lines=200");
    allLogLines = d.lines || [];
    renderLogs();
  }

  function renderLogs() {
    const filter = (document.getElementById("logFilter").value || "").toLowerCase();
    const lines = filter
      ? allLogLines.filter(l => l.toLowerCase().includes(filter))
      : allLogLines;

    document.getElementById("logBox").innerHTML = lines.map(l => {
      let cls = "dim";
      const ll = l.toLowerCase();
      if (ll.includes("error"))    cls = "error";
      else if (ll.includes("warning") || ll.includes("warn")) cls = "warning";
      else if (ll.includes("cache hit") || ll.includes("🎯")) cls = "cache";
      else if (ll.includes("retrieve") || ll.includes("📚") || ll.includes("doc[")) cls = "retrieve";
      else if (ll.includes("info") || ll.includes("←") || ll.includes("→")) cls = "info";
      return `<div class="log-line ${cls}">${escHtml(l)}</div>`;
    }).join("") || '<div style="color:var(--muted)">ไม่มีผลลัพธ์ที่ตรงกับ filter</div>';

    // Scroll to bottom
    const box = document.getElementById("logBox");
    box.scrollTop = box.scrollHeight;
  }

  // ── Tabs ──────────────────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll(".tab-btn").forEach((b, i) => {
      const tabs = ["messages", "context", "logs"];
      b.classList.toggle("active", tabs[i] === name);
    });
    document.querySelectorAll(".tab-content").forEach(el => {
      el.classList.toggle("active", el.id === `tab-${name}`);
    });
    if (name === "logs" && !allLogLines.length) loadLogs();
  }

  // ── View switch (Sessions ⇄ PDF Review Queue) ────────────────────
  function switchView(name) {
    document.getElementById("navBtnSessions").classList.toggle("active", name === "sessions");
    document.getElementById("navBtnPdfQueue").classList.toggle("active", name === "pdfqueue");
    document.getElementById("view-sessions").style.display = name === "sessions" ? "" : "none";
    document.getElementById("view-pdfqueue").style.display = name === "pdfqueue" ? "" : "none";
    document.getElementById("statsBar").style.display = name === "sessions" ? "" : "none";
    if (name === "pdfqueue") loadPdfQueue();
  }

  // ── PDF Review Queue ──────────────────────────────────────────
  let allPdfQueueItems = [];
  let allInFlightItems = [];
  let activePdfQueueItem = null;
  let selectedDecisionType = null;

  async function loadPdfQueue() {
    const d = await apiGet("/admin/api/pdf-queue");
    allPdfQueueItems = d.items || [];
    allInFlightItems = d.in_flight || [];
    document.getElementById("pdfQueueCount").textContent = allPdfQueueItems.length;

    // Badge counts pending reviews + stuck-retrying in-flight docs — both
    // are "needs a human to look" states, unlike a document quietly still
    // OCR-ing normally.
    const pendingCount = allPdfQueueItems.filter(i => i.review_status === "pending").length;
    const failedInFlightCount = allInFlightItems.filter(f => f.stage === "failed").length;
    const badge = document.getElementById("pdfQueueBadge");
    if (pendingCount + failedInFlightCount > 0) {
      badge.style.display = "";
      badge.textContent = pendingCount + failedInFlightCount;
    } else {
      badge.style.display = "none";
    }
    renderPdfQueueList();
  }

  function inFlightRowHtml(f) {
    const isFailed = f.stage === "failed";
    const pill = isFailed
      ? `<span class="status-pill failed-retry">🔴 พัง — กำลัง retry (ครั้งที่ ${f.attempt})</span>`
      : `<span class="status-pill processing">🟡 กำลังประมวลผล (ครั้งที่ ${f.attempt})</span>`;
    const pageInfo = f.pages_total
      ? `<span style="color:var(--muted);font-size:11px">${f.pages_done ?? "?"}/${f.pages_total} หน้า</span>`
      : "";
    return `
      <div class="pq-item in-flight">
        <div class="pq-filename">${escHtml(f.filename)}</div>
        <div class="pq-meta">
          ${pill}
          ${pageInfo}
          <span style="color:var(--muted);font-size:11px">${fmt(f.updated_at)}</span>
        </div>
        ${isFailed && f.error ? `<div class="in-flight-error">${escHtml(f.error)}</div>` : ""}
      </div>`;
  }

  function flagCountPill(totalFlags, highFlags) {
    if (highFlags > 0) return `<span class="flag-pill high">${totalFlags} flag${totalFlags > 1 ? "s" : ""}</span>`;
    if (totalFlags > 0) return `<span class="flag-pill medium">${totalFlags} flag${totalFlags > 1 ? "s" : ""}</span>`;
    return `<span class="flag-pill none">✓ ไม่มี flag</span>`;
  }

  function renderPdfQueueList() {
    const el = document.getElementById("pdfQueueList");
    if (!allPdfQueueItems.length && !allInFlightItems.length) {
      el.innerHTML = '<div style="padding:20px;color:var(--muted);text-align:center">ยังไม่มีไฟล์ในคิว</div>';
      return;
    }
    // In-flight rows (still OCR-ing on EC2, or stuck retrying — no
    // ReviewItem yet) always show above the real queue, newest-updated
    // first, so a stuck/failing document doesn't just silently sit off
    // the bottom of a long list.
    const inFlightHtml = [...allInFlightItems]
      .sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0))
      .map(inFlightRowHtml)
      .join("");

    // department/license_type/page_range let a structured_license PDF that
    // split into several independent review items (sqs_consumer.py,
    // 2026-08-24) be told apart at a glance instead of showing as N
    // identical-looking "filename.pdf" rows.
    const itemsHtml = allPdfQueueItems.map(i => {
      const subParts = [i.department, i.license_type].filter(Boolean).join(" — ");
      return `
      <div class="pq-item ${i.id === activePdfQueueItem ? 'active' : ''}" onclick="selectPdfQueueItem('${i.id}')">
        <div class="pq-filename">${escHtml(i.filename)}${i.page_range ? ` <span class="pq-page-range">(หน้า ${escHtml(i.page_range)})</span>` : ""}</div>
        ${subParts ? `<div class="pq-subtitle">${escHtml(subParts)}</div>` : ""}
        <div class="pq-meta">
          <span class="status-pill ${escHtml(i.review_status)}">${escHtml(i.review_status)}</span>
          ${flagCountPill(i.total_flag_count, i.high_severity_flag_count)}
          ${i.decision_type === "new_category" ? '<span class="badge new-category-badge">④ ต้องตรวจสอบเพิ่ม</span>' : ""}
          <span style="color:var(--muted);font-size:11px">${fmt(i.uploaded_at)}</span>
        </div>
      </div>
    `;
    }).join("");

    el.innerHTML = inFlightHtml + itemsHtml;
  }

  async function selectPdfQueueItem(id) {
    activePdfQueueItem = id;
    selectedDecisionType = null;
    renderPdfQueueList();

    const item = await apiGet(`/admin/api/pdf-queue/${id}`);
    renderPdfQueueDetail(item);
  }

  function flagRow(f) {
    const detailsStr = Object.entries(f.details || {})
      .map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`)
      .join("  |  ");
    return `
      <div class="flag-row ${escHtml(f.severity)}">
        <div class="flag-cat">${escHtml(f.category)} · ${escHtml(f.severity)}</div>
        <div class="flag-msg">${escHtml(f.message)}</div>
        ${detailsStr ? `<div class="flag-details">${escHtml(detailsStr)}</div>` : ""}
      </div>`;
  }

  function pageCard(p, idx) {
    const flags = p.flags || [];
    const hasHigh = flags.some(f => f.severity === "high");
    const badge = flags.length
      ? `<span class="flag-pill ${hasHigh ? 'high' : 'medium'}">${flags.length} flag${flags.length > 1 ? "s" : ""}</span>`
      : `<span class="flag-pill none">✓ ok</span>`;
    return `
      <div class="page-card">
        <div class="page-card-header" onclick="togglePageCard(${idx})">
          <span class="p-title">หน้า ${p.page_num}</span>
          ${badge}
          <span style="margin-left:auto;color:var(--muted)" id="page-toggle-${idx}">${idx === 0 ? "▾" : "▸"}</span>
        </div>
        <div class="page-card-body ${idx === 0 ? 'open' : ''}" id="page-body-${idx}">
          ${flags.map(flagRow).join("") || '<div style="color:var(--muted);font-size:11.5px;margin-bottom:8px">ไม่มี flag ในหน้านี้</div>'}
          <div class="compare-grid">
            <div class="compare-col">
              <div class="compare-col-title">🌪 Typhoon OCR</div>
              <pre>${escHtml(p.typhoon_markdown)}</pre>
            </div>
            <div class="compare-col">
              <div class="compare-col-title">🤖 Claude Vision</div>
              <pre>${escHtml(p.claude_markdown)}</pre>
            </div>
          </div>
        </div>
      </div>`;
  }

  function togglePageCard(idx) {
    const body = document.getElementById(`page-body-${idx}`);
    const toggle = document.getElementById(`page-toggle-${idx}`);
    const isOpen = body.classList.toggle("open");
    toggle.textContent = isOpen ? "▾" : "▸";
  }

  function selectDecisionType(t) {
    selectedDecisionType = t;
    document.querySelectorAll(".dtype-btn").forEach(b => {
      b.classList.toggle("selected", b.dataset.type === t);
    });
    const approveBtn = document.getElementById("btnApproveDecision");
    if (approveBtn) approveBtn.disabled = false;
    const oldRowBox = document.getElementById("oldRowRefBox");
    if (oldRowBox) oldRowBox.style.display = t === "update" ? "block" : "none";
  }

  // Called from a candidate-match row's "ใช้เป็นแถวเดิม" button — jumps straight
  // to "③ update" with the row number pre-filled, since that's the only decision
  // type old_row_ref applies to. Reviewer can still edit the number by hand.
  function useAsOldRowRef(rowNumber) {
    selectDecisionType("update");
    const input = document.getElementById("oldRowRefInput");
    if (input) input.value = rowNumber;
  }

  function fieldsEditorHtml(item) {
    const fields = item.llm_drafted_fields || {};
    const keys = Object.keys(fields);
    const rows = keys.length
      ? keys.map(k => `
          <div class="field-row">
            <div class="field-label">${escHtml(k)}</div>
            <textarea class="field-input" data-field-key="${escHtml(k)}">${escHtml(fields[k] || "")}</textarea>
          </div>`).join("")
      : '<div class="field-readonly">ไม่มีข้อมูลที่ร่างไว้ (item นี้อาจถูกสร้างโดยไม่ผ่าน field-drafting)</div>';

    return `
      <div class="fields-box">
        <div class="fields-title">📝 ฟิลด์ที่ร่างไว้สำหรับเขียนเข้า Sheet</div>
        <div class="fields-subtitle">
          ตรวจสอบ/แก้ไขก่อนอนุมัติ — ค่าที่แก้ในนี้จะถูกใช้เขียนจริง ไม่ใช่ค่าที่ LLM ร่างไว้เฉยๆ<br>
          "อ้างอิง (Research)" จะใส่ชื่อไฟล์ต้นฉบับให้อัตโนมัติ · "เอกสาร AI ร้านอาหาร"/"รวมลิงค์" เว้นว่างไว้ให้กรอกเองถ้าจำเป็น (เป็นลิงก์ภายในทีม ไม่ได้มาจากเอกสาร)
        </div>
        ${rows}
      </div>`;
  }

  function collectEditedFields() {
    const edited = {};
    document.querySelectorAll(".field-input").forEach(el => {
      edited[el.dataset.fieldKey] = el.value;
    });
    return edited;
  }

  // found_by tags -> display label. embedding/identity_match/llm_scan are the
  // 3 independent signals unioned server-side (see pdf_candidate_matching.py) —
  // shown so the reviewer can see WHY a row was flagged, not just that it was.
  const _FOUND_BY_LABELS = {
    embedding: "ความหมายใกล้เคียง",
    identity_match: "หน่วยงาน/ใบอนุญาตตรงกัน",
    llm_scan: "AI อ่านแล้วน่าจะเรื่องเดียวกัน",
  };

  const _DIFF_FIELD_LABELS = {
    registration_type: "ประเภทการจดทะเบียน",
    terms_and_conditions: "เงื่อนไขและหลักเกณฑ์",
    service_channel: "ช่องทางการให้บริการ",
    operation_steps: "ขั้นตอนการดำเนินการ",
    identification_documents: "เอกสารยืนยันตัวตน",
    operation_duration: "ระยะเวลาการดำเนินการ",
    fees: "ค่าธรรมเนียม",
    legal_regulatory: "ข้อกำหนดทางกฎหมายและข้อบังคับ",
  };

  function fieldDiffTableHtml(diffs) {
    if (!diffs || !diffs.length) {
      return `<div class="cm-diff-none">ไม่พบความต่างในฟิลด์รายละเอียด (ขั้นตอน/ค่าธรรมเนียม/เอกสาร ฯลฯ) — น่าจะเป็นข้อมูลเดิมจริงๆ</div>`;
    }
    const rows = diffs.map(d => `
      <tr>
        <td class="cm-diff-field">${escHtml(_DIFF_FIELD_LABELS[d.field] || d.field)}${d.change_type === "added" ? ' <span class="cm-badge">ข้อมูลใหม่</span>' : ""}</td>
        <td class="cm-diff-old">${d.old_value ? escHtml(d.old_value) : '<span class="cm-diff-blank">(ว่าง)</span>'}</td>
        <td class="cm-diff-new">${escHtml(d.new_value)}</td>
      </tr>`).join("");
    return `
      <table class="cm-diff-table">
        <thead><tr><th>ฟิลด์</th><th>ของเดิม (แถวที่มีอยู่)</th><th>ของใหม่ (เอกสารนี้)</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function candidateMatchesHtml(item) {
    const matches = item.candidate_matches;
    // null = not computed for this item (e.g. saved before this feature shipped);
    // [] = computed, genuinely nothing found by any signal — both worth telling
    // the reviewer apart, so only skip the whole section for the null case.
    if (matches === null || matches === undefined) return "";

    if (matches.length === 0) {
      return `<div class="candidate-matches"><div class="cm-title">🔍 รายการที่อาจซ้ำ/เกี่ยวข้อง</div><div class="cm-empty">ไม่พบรายการที่เกี่ยวข้องในชีท (เช็คแล้วทั้งความหมายใกล้เคียง, หน่วยงาน/ใบอนุญาตตรงกัน, และให้ AI อ่านเทียบทุกแถว) — น่าจะเป็นข้อมูลใหม่จริง</div></div>`;
    }

    const rowsHtml = matches.map((m, idx) => {
      const hasSim = typeof m.similarity === "number";
      const pct = hasSim ? Math.round(m.similarity * 100) : null;
      const tier = hasSim ? (m.similarity >= 0.85 ? "high" : m.similarity >= 0.7 ? "medium" : "low") : "low";
      const parts = [m.department, m.license_type, m.operation_topic].filter(Boolean).map(escHtml).join(" — ");
      const foundByBadges = (m.found_by || []).map(f => `<span class="cm-badge">${_FOUND_BY_LABELS[f] || f}</span>`).join("");
      const detailId = `cm-detail-${idx}`;
      return `
        <div class="cm-row-wrap">
          <div class="cm-row" onclick="document.getElementById('${detailId}').classList.toggle('open')">
            <span class="cm-score ${tier}">${hasSim ? pct + "%" : "—"}</span>
            <span class="cm-info"><span class="cm-row-num">แถวที่ ${m.row_number}</span>${parts ? ": " + parts : ""}</span>
            <span class="cm-badges">${foundByBadges}</span>
            <button class="cm-use-btn" onclick="event.stopPropagation();useAsOldRowRef(${m.row_number})">③ ใช้เป็นแถวเดิม</button>
          </div>
          <div class="cm-detail" id="${detailId}">
            ${m.llm_reasoning ? `<div class="cm-llm-reasoning">🤖 ${escHtml(m.llm_reasoning)}</div>` : ""}
            ${fieldDiffTableHtml(m.field_diffs)}
          </div>
        </div>`;
    }).join("");

    return `
      <div class="candidate-matches">
        <div class="cm-title">🔍 รายการที่อาจซ้ำ/เกี่ยวข้อง (${matches.length} รายการ — คลิกแต่ละแถวเพื่อดูว่าต่างจากของเดิมตรงไหน — ไม่ใช่การตัดสินใจอัตโนมัติ)</div>
        ${rowsHtml}
      </div>`;
  }

  function categoryFitHtml(item) {
    const cf = item.category_fit_check;
    if (!cf) return "";
    if (cf.fits_known_category) return "";
    // Only surface a banner for the "doesn't fit" case — a suggestion only,
    // reviewer still has to click ④ themselves, this never auto-selects it.
    return `
      <div class="category-fit-banner">
        ⚠️ อาจเป็นหมวดใหม่ที่ระบบยังไม่รู้จัก (พิจารณาปุ่ม "④ กฎหมายหมวดใหม่")
        ${cf.reasoning ? `<br><span class="cf-reasoning">${escHtml(cf.reasoning)}</span>` : ""}
      </div>`;
  }

  function relevanceCheckHtml(item) {
    const rc = item.relevance_check;
    if (!rc || !rc.tier) return "";
    const labels = {
      relevant: "✅ เกี่ยวข้องกับธุรกิจร้านอาหาร",
      uncertain: "⚠️ ไม่แน่ใจว่าเกี่ยวข้องกับร้านอาหารหรือไม่ — ควรตรวจสอบ",
      not_relevant: "🚫 ดูเหมือนไม่เกี่ยวข้องกับธุรกิจร้านอาหารเลย",
    };
    const label = labels[rc.tier] || rc.tier;
    return `
      <div class="relevance-check ${escHtml(rc.tier)}">
        <span class="rc-tag">${label}</span>
        ${rc.reasoning ? `<span class="rc-reasoning">— ${escHtml(rc.reasoning)}</span>` : ""}
      </div>`;
  }

  function contentShapeHtml(item) {
    const cs = item.content_shape;
    if (!cs || !cs.shape) return "";
    const labels = {
      structured_license: "📋 โครงสร้างใบอนุญาต/ขั้นตอนชัดเจน — ใช้ฟิลด์มาตรฐานด้านล่าง",
      know_how: "📚 เนื้อหา Know-how — แยกเก็บเป็นหัวข้อย่อยแทน (ไม่ใช้ฟิลด์มาตรฐาน)",
    };
    // secondary_pages (2026-08-24): this same PDF upload had a substantial
    // chunk of the OPPOSITE shape, split into a separate sibling item in the
    // queue (same filename, different page range) — noted here so the
    // reviewer isn't confused seeing 2 related entries for one upload.
    const hasSecondary = cs.secondary_pages && cs.secondary_pages.length > 0;
    const secondaryShape = cs.shape === "know_how" ? "โครงสร้างใบอนุญาต" : "know-how";
    const secondaryPagesStr = hasSecondary ? cs.secondary_pages.map(r => r[0] === r[1] ? r[0] : `${r[0]}-${r[1]}`).join(", ") : "";
    return `
      <div class="content-shape ${escHtml(cs.shape)}">
        ${labels[cs.shape] || escHtml(cs.shape)}
        ${cs.reasoning ? `<br><span class="cs-reasoning">${escHtml(cs.reasoning)}</span>` : ""}
        ${hasSecondary ? `<br><span class="cs-reasoning">⚡ ไฟล์นี้มีเนื้อหา${secondaryShape}แทรกอยู่ที่หน้า ${escHtml(secondaryPagesStr)} ด้วย — แยกไปเป็นรายการต่างหากในคิวแล้ว (ค้นหาไฟล์ชื่อเดียวกัน)</span>` : ""}
      </div>`;
  }

  // source_type -> which of the 2 REAL know-how tabs this routes to (see
  // knowhow_write_back.py's _TAB_BY_SOURCE_TYPE — must match exactly).
  const _KNOWHOW_TAB_LABELS = {
    book: 'Know How_ข้อมูลหนังสือ (เนื้อหาจากหนังสือ)',
    document: 'Know how_ร้านอาหาร (เอกสาร/คู่มือทั่วไป)',
  };

  function knowhowTopicsHtml(item) {
    const topics = item.knowhow_topics;
    if (!topics || !topics.length) return "";
    const docTitle = topics[0].document_title || item.filename;
    const tabLabel = _KNOWHOW_TAB_LABELS[topics[0].source_type] || _KNOWHOW_TAB_LABELS.document;

    const cards = topics.map((t, idx) => {
      const fullText = t.full_text || "";
      const isS3Pointer = fullText.startsWith("s3://");
      return `
        <div class="kt-card">
          <div class="kt-card-title">${idx + 1}. ${escHtml(t.main_topic)} — ${escHtml(t.sub_topic)}</div>
          <div class="kt-card-meta">${t.category ? `หมวด: ${escHtml(t.category)} · ` : ""}หน้า ${escHtml(t.page_range || "-")} · ${fullText.length.toLocaleString()} ตัวอักษร</div>
          <div class="kt-card-summary">${escHtml(t.summary)}</div>
          <details class="kt-fulltext-details">
            <summary>${isS3Pointer ? "เนื้อหายาวเกินไป จะเก็บที่ S3 แยก (ไม่แสดงตรงนี้)" : "ดูเนื้อหาเต็ม"}</summary>
            ${isS3Pointer ? `<div class="kt-fulltext">${escHtml(fullText)}</div>` : `<div class="kt-fulltext">${escHtml(fullText)}</div>`}
          </details>
        </div>`;
    }).join("");

    return `
      <div class="knowhow-topics">
        <div class="kt-title">📚 "${escHtml(docTitle)}" — ${topics.length} หัวข้อ (จะเขียนเข้าแท็บ ${escHtml(tabLabel)})</div>
        ${cards}
      </div>`;
  }

  async function submitKnowhowDecision(itemId, reviewStatus) {
    const notesEl = document.getElementById("decisionNotes");
    const body = {
      review_status: reviewStatus,
      // No duplicate-detection built for the know_how tab yet (see
      // pdf_candidate_matching.py's scope) — "new" is the only meaningful
      // decision_type here for now, so it's fixed rather than exposed as a
      // choice the reviewer has to make for no real reason.
      decision_type: reviewStatus === "approved" ? "new" : null,
      reviewer_notes: notesEl ? notesEl.value : "",
    };
    const r = await fetch(`/admin/api/pdf-queue/${itemId}/decision`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      alert("เกิดข้อผิดพลาด: " + (err.error || r.status));
      return;
    }
    await loadPdfQueue();
    selectPdfQueueItem(itemId);
  }

  function renderPdfQueueDetail(item) {
    const panel = document.getElementById("pdfQueueDetailPanel");
    const totalFlags = item.pages.reduce((s, p) => s + (p.flags || []).length, 0);
    const highFlags = item.pages.reduce((s, p) => s + (p.flags || []).filter(f => f.severity === "high").length, 0);

    const isKnowhow = !!(item.knowhow_topics && item.knowhow_topics.length);

    let decisionHtml;
    if (item.review_status !== "pending") {
      decisionHtml = `
        <div class="already-decided">
          ✓ ตรวจสอบแล้ว: <b>${escHtml(item.review_status)}</b>
          ${item.decision_type ? ` — ประเภท: <b>${escHtml(item.decision_type)}</b>` : ""}
          ${item.reviewer_notes ? `<br>หมายเหตุ: ${escHtml(item.reviewer_notes)}` : ""}
        </div>`;
    } else if (isKnowhow) {
      // Simpler decision box for know-how items — no decision-type selector
      // or old_row_ref (see submitKnowhowDecision: decision_type is always
      // fixed to "new", duplicate-detection isn't built for this tab yet).
      decisionHtml = `
        <div class="decision-box">
          <div class="decision-title">การตัดสินใจ (Know-how)</div>
          <div class="decision-subtitle">จะเขียนเข้าแท็บ ${escHtml(_KNOWHOW_TAB_LABELS[item.knowhow_topics[0].source_type] || _KNOWHOW_TAB_LABELS.document)} เป็น ${item.knowhow_topics.length} แถวใหม่ (แยกตามหัวข้อด้านบน) — เพิ่มเท่านั้น ไม่ลบ/ทับของเดิม</div>
          <textarea class="decision-notes" id="decisionNotes" placeholder="หมายเหตุ (ถ้ามี)"></textarea>
          <div class="decision-actions">
            <button class="btn-approve" onclick="submitKnowhowDecision('${item.id}','approved')">✓ อนุมัติทั้งหมด</button>
            <button class="btn-reject" onclick="submitKnowhowDecision('${item.id}','rejected')">✕ ปฏิเสธ</button>
          </div>
        </div>`;
    } else {
      decisionHtml = `
        <div class="decision-box">
          <div class="decision-title">การตัดสินใจ</div>
          <div class="decision-types">
            <button class="dtype-btn" data-type="new" onclick="selectDecisionType('new')">① ข้อมูลใหม่</button>
            <button class="dtype-btn" data-type="duplicate" onclick="selectDecisionType('duplicate')">② ซ้ำกับที่มีอยู่แล้ว</button>
            <button class="dtype-btn" data-type="update" onclick="selectDecisionType('update')">③ อัปเดตแทนที่ของเก่า</button>
            <button class="dtype-btn new_category" data-type="new_category" onclick="selectDecisionType('new_category')">④ กฎหมายหมวดใหม่</button>
          </div>
          <div class="old-row-ref-box" id="oldRowRefBox" style="display:none">
            <label class="old-row-ref-label">เลขแถวเดิมในชีทที่จะถูกแทนที่ (จำเป็นสำหรับ "③ อัปเดต") — คลิก "ใช้เป็นแถวเดิม" จากรายการด้านบน หรือพิมพ์เองก็ได้</label>
            <input type="text" class="old-row-ref-input" id="oldRowRefInput" placeholder="เช่น 181" inputmode="numeric">
          </div>
          <textarea class="decision-notes" id="decisionNotes" placeholder="หมายเหตุ (ถ้ามี)"></textarea>
          <div class="decision-actions">
            <button class="btn-approve" id="btnApproveDecision" disabled onclick="submitDecision('${item.id}','approved')">✓ อนุมัติ (เขียนเพิ่มเข้า Sheet เท่านั้น ไม่ลบ/ทับของเดิม)</button>
            <button class="btn-reject" onclick="submitDecision('${item.id}','rejected')">✕ ปฏิเสธ</button>
          </div>
        </div>`;
    }

    panel.innerHTML = `
      <div class="pq-header">
        <h2>${escHtml(item.filename)}</h2>
        <div class="pq-header-meta">
          <span>📅 อัปโหลด: ${fmt(item.uploaded_at)}</span>
          <span>📄 ${item.pages.length} หน้า</span>
          <span>🚩 ${totalFlags} flags (${highFlags} severity สูง)</span>
        </div>
      </div>
      <div style="flex:1;overflow-y:auto;padding:16px">
        ${relevanceCheckHtml(item)}
        ${contentShapeHtml(item)}
        ${isKnowhow ? knowhowTopicsHtml(item) : categoryFitHtml(item) + candidateMatchesHtml(item)}
        ${item.pages.map((p, idx) => pageCard(p, idx)).join("")}
        ${!isKnowhow && item.review_status === "pending" ? fieldsEditorHtml(item) : ""}
        ${decisionHtml}
      </div>
    `;
  }

  async function submitDecision(itemId, reviewStatus) {
    if (reviewStatus === "approved" && !selectedDecisionType) {
      alert("กรุณาเลือกประเภทการตัดสินใจก่อนอนุมัติ");
      return;
    }
    let oldRowRef = null;
    if (reviewStatus === "approved" && selectedDecisionType === "update") {
      const oldRowInput = document.getElementById("oldRowRefInput");
      oldRowRef = oldRowInput ? oldRowInput.value.trim() : "";
      if (!oldRowRef) {
        alert('กรุณาระบุ "เลขแถวเดิมที่จะถูกแทนที่" ก่อนอนุมัติ (จำเป็นสำหรับ ③ อัปเดตแทนที่ของเก่า)');
        return;
      }
    }
    const notesEl = document.getElementById("decisionNotes");
    const body = {
      review_status: reviewStatus,
      decision_type: reviewStatus === "approved" ? selectedDecisionType : null,
      reviewer_notes: notesEl ? notesEl.value : "",
      edited_fields: reviewStatus === "approved" ? collectEditedFields() : null,
      old_row_ref: oldRowRef,
    };
    const r = await fetch(`/admin/api/pdf-queue/${itemId}/decision`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      alert("เกิดข้อผิดพลาด: " + (err.error || r.status));
      return;
    }
    // old_row_ref_warning (2026-08-25): the write still succeeds even when
    // the old row doesn't relate to the new content at all (a typo'd row
    // number is otherwise silent — see sheet_write_back.py) — surfaced here
    // so the reviewer notices immediately instead of it staying buried in
    // server logs only they'd never look at.
    const resBody = await r.json().catch(() => ({}));
    if (resBody.sheet_result && resBody.sheet_result.old_row_ref_warning) {
      alert("⚠️ คำเตือน: " + resBody.sheet_result.old_row_ref_warning);
    }
    await loadPdfQueue();
    selectPdfQueueItem(itemId);
  }

  // ── Init ──────────────────────────────────────────────────────
  async function loadAll() {
    document.getElementById("lastRefresh").textContent =
      "อัพเดท " + new Date().toLocaleTimeString("th-TH");
    await Promise.all([loadStats(), loadSessions(), loadPdfQueue()]);
  }

  loadAll();
  // Auto-refresh ทุก 30 วินาที
  setInterval(loadAll, 30000);
</script>
</body>
</html>
