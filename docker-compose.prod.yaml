version: '3.9'

services:
  serve:
    container_name: ai-operation-prod
    image: ai-operation:prod
    platform: linux/amd64
    build:
      context: .
      target: prod
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Production: ไม่ mount code (เพื่อความปลอดภัย)
      # Mount เฉพาะ env file
      - ./env.properties:/app/env.properties
      # Google service-account key for Sheets feedback logging — never baked into the
      # image (see .gitignore), must exist on the host at this path before `up`
      - ./credentials.json:/app/credentials.json
      # Persist HuggingFace model cache across container restarts/redeploys
      - /opt/huggingface-cache:/root/.cache/huggingface
      # Persist session state (data/states/*.json) across redeploys — without this,
      # every `docker-compose up` after a new image pull starts from an empty
      # writable layer and silently wipes all conversations before the claimed
      # 7-day retention (SESSION_RETENTION_DAYS in router/route_v1.py).
      # Host dir must be owned by uid:gid 1000:1000 (appuser in Dockerfile) — see
      # deploy_ec2.md one-time setup step.
      - /opt/restbiz-data:/app/code/data
    environment:
      - PYTHONPATH=/app/code
    env_file:
      - ./env.properties
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s      # ตรวจทุก 30 วิ
      timeout: 5s        # รอ response ไม่เกิน 5 วิ
      retries: 3         # fail 3 ครั้งติดกันถึงจะ unhealthy
      start_period: 40s  # รอ 40 วิก่อน check ครั้งแรก (โหลด e5-large ~20 วิ)
    restart: unless-stopped

networks:
  default:
    name: ai-operation-network
