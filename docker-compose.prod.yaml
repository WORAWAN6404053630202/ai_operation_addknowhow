version: '3.9'

services:
  serve:
    container_name: ai-operation-prod
    image: ai-operation:prod
    platform: linux/amd64
    build:
      context: .
      target: prod
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Production: ไม่ mount code (เพื่อความปลอดภัย)
      # Mount เฉพาะ env file — ABSOLUTE path, not relative to this compose file's own
      # directory. The real deploy history (`docker run ... --env-file ~/env.properties`)
      # confirmed these two files live directly in the ec2-user home dir, not next to
      # this compose file — a `./`-relative path here silently pointed at a stale,
      # long-unused copy instead (found 2026-08-19; see incident notes).
      - /home/ec2-user/env.properties:/app/env.properties
      # Google service-account key for Sheets feedback logging — never baked into the
      # image (see .gitignore), must exist on the host at this path before `up`
      - /home/ec2-user/credentials.json:/app/credentials.json
      # Persist HuggingFace model cache across container restarts/redeploys.
      # 2026-10 fix (Infra2-M1): was mounted at /root/.cache/huggingface, but
      # the `prod` stage's Dockerfile runs as non-root `appuser` (uid 1000,
      # home /home/appuser) — transformers/sentence-transformers resolve the
      # cache dir from the real $HOME, so every container actually read/wrote
      # /home/appuser/.cache/huggingface and this mount was never hit at all,
      # silently re-downloading the embedding model on every redeploy (see
      # the healthcheck's "~20s to load e5-large" comment below — that cost
      # was paid every single time, not just on a cold cache). Host dir needs
      # the same uid:gid 1000:1000 ownership as /opt/restbiz-data above.
      - /opt/huggingface-cache:/home/appuser/.cache/huggingface
      # Persist session state (data/states/*.json) across redeploys — without this,
      # every `docker-compose up` after a new image pull starts from an empty
      # writable layer and silently wipes all conversations before the claimed
      # 7-day retention (SESSION_RETENTION_DAYS in router/route_v1.py).
      # Host dir must be owned by uid:gid 1000:1000 (appuser in Dockerfile) — see
      # deploy_ec2.md one-time setup step.
      - /opt/restbiz-data:/app/code/data
      # 2026-10 fix (Infra-M10): persists the rotating incident log (see
      # LOG_FILE in env.properties) across container recreation — without
      # this mount the file lives only in the writable layer and is lost on
      # every redeploy, the exact problem this feature was built to solve
      # (see incident_diagnosability memory). Host dir needs the same
      # uid:gid 1000:1000 ownership as /opt/restbiz-data above.
      - /opt/restbiz-logs:/app/logs
    environment:
      - PYTHONPATH=/app/code
    env_file:
      - /home/ec2-user/env.properties
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s      # ตรวจทุก 30 วิ
      timeout: 5s        # รอ response ไม่เกิน 5 วิ
      retries: 3         # fail 3 ครั้งติดกันถึงจะ unhealthy
      start_period: 40s  # รอ 40 วิก่อน check ครั้งแรก (โหลด e5-large ~20 วิ)
    restart: unless-stopped
    # 2026-10 fix (Infra2-C5): no logging driver config meant Docker's
    # default json-file driver kept stdout with NO ceiling at all — and
    # env.properties sets LOG_LEVEL=DEBUG, which sends everything to
    # stdout (the 30MB ceiling on the separate rotating FILE handler,
    # see Infra-M10, never applied to this). An unbounded DEBUG stream
    # could fill the EC2 root volume, taking down both containers plus
    # session-state writes together with no warning.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # 2026-10 fix (Infra2-M8, partial): pids_limit guards against an
    # unbounded fork/thread runaway in either container starving the other
    # — safe to set without knowing the instance's real capacity. Did NOT
    # add mem_limit/cpus here: guessing a ceiling without knowing the real
    # EC2 instance's actual RAM/vCPU would risk OOM-killing a live
    # production container under normal load instead of preventing an
    # incident — needs the real instance type's numbers before setting
    # those two specifically.
    pids_limit: 512

  # PDF ingestion review dashboard — split into its own service (2026-09) so a
  # PDF-only dependency crash (see the boto3 incident, 2026-09-06/07) can never
  # take the `serve` container above down again. No local_chroma_v3/
  # huggingface-cache volumes needed — this service never touches RAG/embeddings.
  pdf-serve:
    container_name: ai-operation-pdf-prod
    image: ai-operation-pdf:prod
    platform: linux/amd64
    build:
      context: .
      target: prod-pdf
      dockerfile: ./Dockerfile
    ports:
      - "3001:3001"
    volumes:
      # Same env file and Sheets credential as `serve` for now — not forked
      # into PDF-specific secrets in this pass (see the migration plan; that's
      # an optional follow-up if secret isolation is wanted later).
      - /home/ec2-user/env.properties:/app/env.properties
      - /home/ec2-user/credentials.json:/app/credentials.json
      # 2026-10 fix (Infra2-C2): env.properties sets LOG_FILE=/app/logs/app.log
      # globally — without this mount (and the matching `RUN mkdir -p /app/logs`
      # added to the prod-pdf stage), app_pdf.py's setup_logging() call opens a
      # RotatingFileHandler against a path that doesn't exist, crash-looping
      # this service. Same uid:gid 1000:1000 ownership requirement as the
      # `serve` service's /opt/restbiz-logs mount above.
      - /opt/restbiz-pdf-logs:/app/logs
    environment:
      - PYTHONPATH=/app/code
    env_file:
      - /home/ec2-user/env.properties
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s  # no embedding model to load — ready almost immediately
    restart: unless-stopped
    # 2026-10 fix (Infra2-C5) — see the matching comment on `serve` above;
    # same unbounded-stdout risk applies to this service too.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # 2026-10 fix (Infra2-M8, partial) — see the matching comment on `serve`
    # above; same reasoning (pids_limit safe to set blind, mem_limit/cpus not).
    pids_limit: 256

networks:
  default:
    name: ai-operation-network
